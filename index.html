<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta property="og:type" content="website">
    <meta property="og:title" content="SMOKE KOSTA">
    <meta property="og:description" content="Переходи в наш каталог или же прайс-лист⬇️">
    <meta property="og:url" content="https://smokekatalog.netlify.app">
    <meta property="og:image" content="https://i.ibb.co.com/WN9JJ1W1/catalog.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SMOKE KOSTA">
    <meta name="twitter:description" content="Переходи в наш каталог или же прайс-лист⬇️">
    <meta name="twitter:image" content="https://i.ibb.co.com/WN9JJ1W1/catalog.png">

    <title>SMOKE KOSTA | Летний Каталог</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="logot.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        :root {
            --green-accent: #22c55e;
            --promo-color: #ff00d4;
            --bg-main: #090c0b;
            --card-bg: #0b2114;
            --out-of-stock-color: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-main);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            width: 100%;
        }


        #hintBox {
            position: fixed;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 18px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 80px 15px 180px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        header h1 {
            font-size: clamp(3.5rem, 12vw, 5.5rem);
            font-weight: 900;
            color: var(--green-accent);
            text-transform: uppercase;
            letter-spacing: -4px;
            line-height: 0.8;
        }

        #catalog-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 30px;
        }

        .catalog-item {
            background: #0e1a13;
            border-radius: 35px;
            padding: 70px 25px 35px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
        }

        .promo-badge {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--promo-color);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 0.8rem;
            text-decoration: none;
            z-index: 10;
            white-space: nowrap;
        }

        .item-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .specs {
            color: var(--green-accent);
            font-weight: 700;
            opacity: 0.5;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .price-box {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .old-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: line-through;
            margin-bottom: 4px;
        }

        .price-tag {
            background: var(--green-accent);
            color: #000;
            padding: 10px 30px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 1.6rem;
        }

        .flavor-list {
            width: 100%;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* СТИЛЬ ДЛЯ КНОПОК ВКУСА */
        .flavor-list li {
            background: rgba(255, 255, 255, 0.03);
            padding: 18px 20px;
            border-radius: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            border: 2px solid transparent;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* КОГДА ВКУС ВЫБРАН */
        .flavor-list li.selected {
            border-color: var(--green-accent);
            background: rgba(34, 197, 94, 0.1);
            color: var(--green-accent);
        }

        /* КОГДА ВКУСА НЕТ (ТО ЧТО ТЫ ПРОСИЛ) */
        .flavor-list li.out-of-stock {
            background: rgba(255, 255, 255, 0.01);
            color: var(--out-of-stock-color);
            border-color: transparent;
            text-decoration: line-through;
            cursor: not-allowed;
            pointer-events: none;
            /* Чтобы нельзя было кликнуть */
            filter: grayscale(1) blur(0.5px);
        }

        .order-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150px);
            width: 92%;
            max-width: 480px;
            background: var(--green-accent);
            color: #000;
            padding: 22px 30px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.1rem;
            z-index: 3000;
            opacity: 0;
        }

        .no-flavors {
            padding: 25px;
            color: #ffab00;
            font-weight: 800;
            border: 2px dashed rgba(255, 171, 0, 0.2);
            border-radius: 25px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div id="hintBox">
        <p>💡 Нажми на вкус, чтобы добавить в заказ!</p>
        <span onclick="hideHintManually()" style="cursor:pointer; font-weight:900; padding: 5px;">✕</span>
    </div>

    <div class="container">
        <header id="head-anim">
            <h1>SMOKE<br>KOSTA</h1>
        </header>
        <div id="catalog-container"></div>
    </div>

    <a href="#" id="orderBtn" class="order-btn">
        <span id="btnLabel">ВЫБЕРИТЕ ТОВАР</span>
        <span id="totalPrice" style="background: rgba(0,0,0,0.1); padding: 7px 15px; border-radius: 10px;">0 тг</span>
    </a>

    <script>
        gsap.registerPlugin(ScrollTrigger);
        let cart = [];

        function hideHint() { gsap.to("#hintBox", { y: -200, opacity: 0, duration: 1, ease: "back.in(1.2)" }); }
        function hideHintManually() { hideHint(); }

        async function init() {
            try {
                const res = await fetch('products.json');
                const data = await res.json();
                render(data);

                gsap.from("#head-anim h1", { scale: 0.9, opacity: 0, duration: 1, ease: "power2.out" });

                const hintTl = gsap.timeline();
                hintTl.to("#hintBox", { top: "25px", duration: 1.2, ease: "elastic.out(1, 0.8)", delay: 1 })
                    .to("#hintBox", { y: -200, opacity: 0, duration: 1, ease: "back.in(1.2)", delay: 4 });

            } catch (e) { console.error(e); }
        }

        function render(products) {
            const root = document.getElementById('catalog-container');
            root.innerHTML = products.map((p, pIdx) => `
            <div class="catalog-item">
                ${p.promo ? `<a href="${p.promoLink}" class="promo-badge">${p.promo}</a>` : ''}
                <div class="item-title">${p.name}</div>
                <div class="specs">${p.specs}</div>
                <div class="price-box">
                    ${p.oldPrice ? `<div class="old-price">${p.oldPrice} тг</div>` : ''}
                    <div class="price-tag">${p.price} тг</div>
                </div>
                ${p.flavors.length > 0 ? `
                    <ul class="flavor-list">
                        ${p.flavors.map(f => `
                            <li class="${f.stock ? '' : 'out-of-stock'}" 
                                onclick="pick('${p.name}', '${f.name}', '${p.price}', this, ${f.stock})">
                                <span>${f.name}</span>
                                <span style="opacity:0.3;">${f.stock ? '+' : '✕'}</span>
                            </li>
                        `).join('')}
                    </ul>
                ` : `<div class="no-flavors">⚠️ Вкусы временно отсутствуют</div>`}
            </div>
        `).join('');

            gsap.to(".catalog-item", {
                opacity: 1, y: 0, duration: 1, stagger: 0.1, ease: "power3.out",
                scrollTrigger: { trigger: "#catalog-container", start: "top 90%" }
            });

            gsap.to(".promo-badge", {
                scale: 1.08,
                boxShadow: "0 15px 35px rgba(255, 0, 212, 0.7)",
                duration: 0.8,
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut"
            });
        }

        function pick(pName, fName, priceStr, el, stock) {
            if (!stock) return; // Блокировка выбора, если stock: false

            gsap.to("#hintBox", { opacity: 0, y: -200, duration: 0.5 });

            const id = `${pName} (${fName})`;
            const price = parseInt(priceStr.replace(/\s/g, ''));
            const idx = cart.findIndex(c => c.id === id);

            if (idx === -1) {
                cart.push({ id, price });
                el.classList.add('selected');
                gsap.fromTo(el, { scale: 0.97 }, { scale: 1.02, duration: 0.3, ease: "back.out(3)", yoyo: true, repeat: 1 });
            } else {
                cart.splice(idx, 1);
                el.classList.remove('selected');
            }
            updateUI();
        }

        function updateUI() {
            const btn = document.getElementById('orderBtn');
            const priceDisplay = document.getElementById('totalPrice');
            const total = cart.reduce((s, i) => s + i.price, 0);

            if (cart.length > 0) {
                document.getElementById('btnLabel').innerText = `ЗАКАЗАТЬ (${cart.length})`;
                let curr = { v: parseInt(priceDisplay.innerText) || 0 };
                gsap.to(curr, {
                    v: total, duration: 0.5, onUpdate: () => {
                        priceDisplay.innerText = Math.floor(curr.v).toLocaleString() + ' тг';
                    }
                });
                gsap.to(btn, { y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.5)" });
                btn.href = "https://t.me/smokemanagerQST?text=" + encodeURIComponent("☀️ ЗАКАЗ:\n" + cart.map(i => "— " + i.id).join("\n") + "\n\n💰 ИТОГО: " + total + " тг");
            } else {
                gsap.to(btn, { y: 150, opacity: 0, duration: 0.4 });
            }
        }


        init();
    </script>
</body>

</html>
